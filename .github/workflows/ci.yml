name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - name: Unit, regression, sync-canary, and balance-canary tests
        run: python -m pytest -q

  sync-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements-dev.txt
      - name: Tribe/piece sync must hold across full bot games (all scenarios)
        run: |
          python -m fs_bot.tools.sync_check --scenario "Pax Gallica?" --seeds 1-8
          python -m fs_bot.tools.sync_check --scenario "Reconquest of Gaul" --seeds 1-8
          python -m fs_bot.tools.sync_check --scenario "The Great Revolt" --seeds 1-8
          python -m fs_bot.tools.sync_check --scenario "Ariovistus" --seeds 1-8
          python -m fs_bot.tools.sync_check --scenario "The Gallic War" --seeds 1-8

  event-census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements-dev.txt
      - name: Nested Event, Winter, and Command outcomes must be legal
        run: PYTHONHASHSEED=0 python -m fs_bot.tools.error_census --seeds 1-10 --strict

  player-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements-dev.txt
      - name: Random-legal player fuzz (mixed seats) + cross-hashseed determinism
        shell: bash
        run: |
          set -o pipefail
          PYTHONHASHSEED=0 python -m fs_bot.tools.player_fuzz --seeds 1-40 | tee fuzz0.txt
          PYTHONHASHSEED=7 python -m fs_bot.tools.player_fuzz --seeds 1-40 | tee fuzz7.txt
          diff fuzz0.txt fuzz7.txt

  balance-guardrail:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements-dev.txt
      - name: Scenario win rates must stay within the reviewed drift band
        run: python -m fs_bot.tools.balance_smoke --seeds 1-20

  card-edition-games:
    name: Full games (${{ matrix.card_edition }})
    strategy:
      fail-fast: false
      matrix:
        card_edition: [legacy, original, second-edition]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements-dev.txt
      - name: Held-out bot games and mixed-seat replay in every scenario
        env:
          CARD_EDITION: ${{ matrix.card_edition }}
        run: |
          set -o pipefail
          PYTHONHASHSEED=0 python -m fs_bot.tools.run_batch \
            --seeds 201-203 --card-edition "$CARD_EDITION" --workers 2 --out edition-bots
          PYTHONHASHSEED=0 python -m fs_bot.tools.player_fuzz \
            --seeds 201-203 --card-edition "$CARD_EDITION" --out edition-fuzz0.json | tee edition-fuzz0.txt
          PYTHONHASHSEED=7 python -m fs_bot.tools.player_fuzz \
            --seeds 201-203 --card-edition "$CARD_EDITION" --out edition-fuzz7.json | tee edition-fuzz7.txt
          diff edition-fuzz0.txt edition-fuzz7.txt
          diff edition-fuzz0.json edition-fuzz7.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-edition-${{ matrix.card_edition }}
          path: |
            edition-bots/
            edition-fuzz*
